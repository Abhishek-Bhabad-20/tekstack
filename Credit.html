<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Revised Credit Card Limit Check</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #00b894;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #003366;
            text-decoration: underline;
        }

        button {
            background-color: orange;
            border: 1px solid black;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        #reportMessage {
            margin-top: 15px;
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #00b894;
        }

        th,
        td {
            border: 1px solid black;
            padding: 5px 10px;
            text-align: left;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Revised Credit Card Limit Check</h2>

    <p>
        To get data from API:
        <button onclick="getCreditCardData()">Click Here</button>
    </p>

    <div id="message"></div>

    <div id="tableContainer"></div>

    <div id="reportMessage"></div>


    <script>

        function getCreditCardData() {

            var xhr = new XMLHttpRequest();

            var url =
                "https://webapps.tekstac.com/WebAPI/CreditCardsXMLServlet";

            xhr.open("GET", url, true);

            xhr.onreadystatechange = function () {

                if (xhr.readyState === 4) {

                    if (xhr.status === 200) {

                        var xmlData = xhr.responseXML;

                        var cards = [];

                        /*
                         * Get all card elements.
                         * The API may use different capitalization,
                         * so we locate elements by their tag names.
                         */
                        var cardNodes = xmlData.getElementsByTagName("card");

                        /*
                         * If <card> is not found, try <Card>
                         */
                        if (cardNodes.length === 0) {
                            cardNodes = xmlData.getElementsByTagName("Card");
                        }

                        /*
                         * Process every credit card
                         */
                        for (var i = 0; i < cardNodes.length; i++) {

                            var card = cardNodes[i];

                            var cardName =
                                getValue(card, [
                                    "cardholdername",
                                    "cardholder",
                                    "cardname",
                                    "name",
                                    "cardholderName",
                                    "cardName"
                                ]);

                            var cardType =
                                getValue(card, [
                                    "cardtype",
                                    "type",
                                    "cardType"
                                ]);

                            var cardLimit =
                                getValue(card, [
                                    "cardlimit",
                                    "limit",
                                    "creditlimit",
                                    "creditLimit",
                                    "cardLimit"
                                ]);

                            var expiryDate =
                                getValue(card, [
                                    "expirydate",
                                    "expiry",
                                    "expirationdate",
                                    "expiryDate"
                                ]);

                            var cardObject = {
                                cardName: cardName,
                                cardType: cardType,
                                cardLimit: cardLimit,
                                expiryDate: expiryDate
                            };

                            cards.push(cardObject);
                        }


                        /*
                         * Check whether exactly 16 records
                         * were received.
                         */
                        if (cards.length === 16) {

                            document.getElementById("message").innerHTML =
                                "Data retrieved successfully.";

                            generateTable(cards);

                        } else {

                            /*
                             * Fallback in case the XML uses a
                             * different structure.
                             */
                            var allElements =
                                xmlData.getElementsByTagName("*");

                            cards = extractCardsFromXML(allElements);

                            if (cards.length === 16) {

                                document.getElementById("message").innerHTML =
                                    "Data retrieved successfully.";

                                generateTable(cards);

                            } else {

                                document.getElementById("message").innerHTML =
                                    "Data retrieval failed. Expected 16 entries but found "
                                    + cards.length + ".";

                            }
                        }

                    } else {

                        document.getElementById("message").innerHTML =
                            "Error while retrieving data. Status code: "
                            + xhr.status;
                    }
                }
            };

            xhr.send();
        }


        /*
         * Returns the text value of a tag inside a card.
         */
        function getValue(parent, possibleNames) {

            var children = parent.children;

            for (var i = 0; i < children.length; i++) {

                var tagName =
                    children[i].tagName.toLowerCase();

                for (var j = 0; j < possibleNames.length; j++) {

                    if (tagName === possibleNames[j].toLowerCase()) {

                        return children[i].textContent.trim();
                    }
                }
            }

            return "";
        }


        /*
         * Fallback XML parser.
         *
         * This handles the situation where the API does not
         * use exactly <card> as the record element.
         */
        function extractCardsFromXML(elements) {

            var result = [];

            var names = [];
            var types = [];
            var limits = [];
            var expiries = [];

            for (var i = 0; i < elements.length; i++) {

                var tag =
                    elements[i].tagName.toLowerCase();

                var value =
                    elements[i].textContent.trim();

                if (
                    tag === "cardholdername" ||
                    tag === "cardholder" ||
                    tag === "cardname"
                ) {
                    names.push(value);
                }

                else if (
                    tag === "cardtype"
                ) {
                    types.push(value);
                }

                else if (
                    tag === "cardlimit" ||
                    tag === "creditlimit"
                ) {
                    limits.push(value);
                }

                else if (
                    tag === "expirydate" ||
                    tag === "expirationdate"
                ) {
                    expiries.push(value);
                }
            }

            var count = Math.min(
                names.length,
                types.length,
                limits.length,
                expiries.length
            );

            for (var j = 0; j < count; j++) {

                result.push({
                    cardName: names[j],
                    cardType: types[j],
                    cardLimit: limits[j],
                    expiryDate: expiries[j]
                });
            }

            return result;
        }


        /*
         * Dynamically generate the HTML table.
         */
        function generateTable(cards) {

            var container =
                document.getElementById("tableContainer");

            container.innerHTML = "";

            var table =
                document.createElement("table");

            var thead =
                document.createElement("thead");

            var headerRow =
                document.createElement("tr");


            var headers = [
                "Card Holder Name",
                "Card Type",
                "Card Limit",
                "Expiry Date"
            ];


            for (var i = 0; i < headers.length; i++) {

                var th =
                    document.createElement("th");

                th.textContent = headers[i];

                headerRow.appendChild(th);
            }

            thead.appendChild(headerRow);

            table.appendChild(thead);


            var tbody =
                document.createElement("tbody");


            /*
             * Iterate over stored collection
             * and create table rows.
             */
            for (var i = 0; i < cards.length; i++) {

                var row =
                    document.createElement("tr");


                var nameCell =
                    document.createElement("td");

                nameCell.textContent =
                    cards[i].cardName;


                var typeCell =
                    document.createElement("td");

                typeCell.textContent =
                    cards[i].cardType;


                var limitCell =
                    document.createElement("td");

                limitCell.textContent =
                    cards[i].cardLimit;


                var expiryCell =
                    document.createElement("td");

                expiryCell.textContent =
                    cards[i].expiryDate;


                row.appendChild(nameCell);
                row.appendChild(typeCell);
                row.appendChild(limitCell);
                row.appendChild(expiryCell);

                tbody.appendChild(row);
            }


            table.appendChild(tbody);

            container.appendChild(table);


            /*
             * Display final confirmation.
             */
            document.getElementById("reportMessage").innerHTML =
                "Report generated successfully!!!";
        }

    </script>

</body>
</html>
