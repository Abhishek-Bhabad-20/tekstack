<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Score Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #c9a66b;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 80%;
            max-width: 850px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #63c8f5;
            text-shadow: 2px 2px 3px black;
        }

        form {
            background-color: #b9efff;
            padding: 25px;
            border-radius: 15px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
        }

        button {
            padding: 15px 25px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        #error {
            color: red;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }

        #studentList {
            margin-top: 35px;
        }

        .student {
            background-color: #b9efff;
            padding: 15px 25px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 20px;
        }

        #average {
            text-align: center;
            color: #63c8f5;
            font-size: 25px;
            font-weight: bold;
            margin-top: 50px;
            text-shadow: 2px 2px 3px black;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Score Tracker</h1>

    <form id="studentForm">

        <input
            type="text"
            id="studentName"
            placeholder="Student Name"
        >

        <input
            type="number"
            id="score"
            placeholder="Score"
        >

        <button type="submit">Add</button>

    </form>

    <div id="error"></div>

    <div id="studentList"></div>

    <div id="average">
        Average Score: 0
    </div>

</div>


<script>

    // Array to store student records
    let students = [];


    // Get form
    const form = document.getElementById("studentForm");


    // Form submit event listener
    form.addEventListener("submit", function(event) {

        // Prevent page reload
        event.preventDefault();

        // Get input values
        const name =
            document.getElementById("studentName").value.trim();

        const scoreValue =
            document.getElementById("score").value.trim();


        // Clear previous error
        document.getElementById("error").innerHTML = "";


        // Validate name
        if (name === "") {

            document.getElementById("error").innerHTML =
                "Student name cannot be empty";

            return;
        }


        // Validate score
        if (scoreValue === "") {

            document.getElementById("error").innerHTML =
                "Score cannot be empty";

            return;
        }


        // Convert score into number
        const score = Number(scoreValue);


        // Check valid number
        if (isNaN(score)) {

            document.getElementById("error").innerHTML =
                "Score must be a valid number";

            return;
        }


        // Check negative score
        if (score < 0) {

            document.getElementById("error").innerHTML =
                "Score cannot be negative";

            return;
        }


        // Optional: score should not exceed 100
        if (score > 100) {

            document.getElementById("error").innerHTML =
                "Score cannot be greater than 100";

            return;
        }


        // Store student object in array
        const student = {
            name: name,
            score: score
        };

        students.push(student);


        // Display updated list
        displayStudents();


        // Clear input fields
        document.getElementById("studentName").value = "";
        document.getElementById("score").value = "";

    });


    // Function to display students
    function displayStudents() {

        const list =
            document.getElementById("studentList");

        // Clear old list
        list.innerHTML = "";


        // Create list items dynamically
        students.forEach(function(student, index) {

            const item =
                document.createElement("div");

            item.className = "student";

            item.textContent =
                student.name + " - " + student.score;


            /*
             * Double-click event listener
             * removes the student.
             */
            item.addEventListener("dblclick", function() {

                // Remove from array FIRST
                students.splice(index, 1);

                // Update display
                displayStudents();

            });


            list.appendChild(item);

        });


        // Update average
        updateAverage();
    }


    // Function to calculate and display average
    function updateAverage() {

        const averageElement =
            document.getElementById("average");


        // If there are no students
        if (students.length === 0) {

            averageElement.innerHTML =
                "Average Score: 0";

            return;
        }


        // Calculate total score
        let total = 0;

        students.forEach(function(student) {

            total += student.score;

        });


        // Calculate average
        const average =
            total / students.length;


        // Display average with 2 decimal places
        averageElement.innerHTML =
            "Average Score of " +
            students.length +
            " Students: " +
            average.toFixed(2);
    }

</script>

</body>
</html>
